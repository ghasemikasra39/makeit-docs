<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Authorization Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        h1 {
            color: #fe2c55;
            margin-top: 0;
        }
        .code-box {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            word-break: break-all;
            margin: 15px 0;
            border: 1px solid #444;
        }
        .label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .success { color: #25f4ee; }
        .error { color: #fe2c55; }
        .copy-btn {
            background: #fe2c55;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .copy-btn:hover {
            background: #e0284d;
        }
        .instructions {
            margin-top: 20px;
            padding: 15px;
            background: #363636;
            border-radius: 8px;
            font-size: 14px;
        }
        .instructions code {
            background: #1a1a1a;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 TikTok OAuth Callback</h1>
        <div id="result"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const error = params.get('error');
        const errorDescription = params.get('error_description');

        const resultDiv = document.getElementById('result');

        if (error) {
            resultDiv.innerHTML = `
                <p class="error">❌ Authorization Failed</p>
                <div class="label">Error</div>
                <div class="code-box">${error}</div>
                <div class="label">Description</div>
                <div class="code-box">${errorDescription || 'No description provided'}</div>
            `;
        } else if (code) {
            resultDiv.innerHTML = `
                <p class="success">✅ Authorization Successful!</p>
                <div class="label">Authorization Code</div>
                <div class="code-box" id="auth-code">${code}</div>
                <button class="copy-btn" onclick="copyCode()">📋 Copy Code</button>
                ${state ? `
                    <div class="label" style="margin-top: 15px;">State</div>
                    <div class="code-box">${state}</div>
                ` : ''}
                <div class="instructions">
                    <strong>Next step:</strong> Use this code to get your access token by running the token exchange script.
                    <br><br>
                    The code expires in <strong>1 minute</strong>, so copy it quickly!
                </div>
            `;
        } else {
            resultDiv.innerHTML = `
                <p class="error">❌ No authorization code received</p>
                <p>Make sure you're redirected here from TikTok's authorization page.</p>
            `;
        }

        function copyCode() {
            const code = document.getElementById('auth-code').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = '✅ Copied!';
                setTimeout(() => btn.textContent = '📋 Copy Code', 2000);
            });
        }
    </script>
</body>
</html>
